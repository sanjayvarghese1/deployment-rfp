workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - validate
  - iac
  - unit
  - build
  - integration
  - render
  - mirror

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  NEXT_TELEMETRY_DISABLED: "1"

cache:
  paths:
    - .cache/pip
    - .cache/npm

default:
  interruptible: true

.terraform_base:
  image: debian:bookworm-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl unzip
    - rm -rf /var/lib/apt/lists/*
    - export TERRAFORM_VERSION="1.11.3"
    - curl -fsSL -o /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
    - unzip -o /tmp/terraform.zip -d /usr/local/bin
    - terraform version
    - |
      # Accept TF_VAR_ or direct env names or legacy TL_VAR_ variants
      export TF_VAR_vercel_api_token="${TF_VAR_vercel_api_token:-${VERCEL_API_TOKEN:-${TL_VAR_vercel_api_token:-}}}"
      export TF_VAR_vercel_git_repository="${TF_VAR_vercel_git_repository:-${VERCEL_GIT_REPOSITORY:-${TL_VAR_vercel_git_repository:-}}}"
      export TF_VAR_vercel_backend_url="${TF_VAR_vercel_backend_url:-${VERCEL_BACKEND_URL:-${TL_VAR_vercel_backend_url:-}}}"
      export TF_VAR_next_public_supabase_url="${TF_VAR_next_public_supabase_url:-${NEXT_PUBLIC_SUPABASE_URL:-${TL_VAR_next_public_supabase_url:-}}}"
      export TF_VAR_next_public_supabase_anon_key="${TF_VAR_next_public_supabase_anon_key:-${NEXT_PUBLIC_SUPABASE_ANON_KEY:-${TL_VAR_next_public_supabase_anon_key:-}}}"
      export TF_VAR_supabase_service_role_key="${TF_VAR_supabase_service_role_key:-${SUPABASE_SERVICE_ROLE_KEY:-${TL_VAR_supabase_service_role_key:-}}}"
      export TF_VAR_openrouter_api_key="${TF_VAR_openrouter_api_key:-${OPENROUTER_API_KEY:-${TL_VAR_openrouter_api_key:-}}}"
      export TF_VAR_vercel_team_id="${TF_VAR_vercel_team_id:-${VERCEL_TEAM_ID:-${TL_VAR_vercel_team_id:-}}}"
      export TF_VAR_vercel_custom_domain="${TF_VAR_vercel_custom_domain:-${VERCEL_CUSTOM_DOMAIN:-${TL_VAR_vercel_custom_domain:-}}}"
      export TF_VAR_pdfshift_api_key="${TF_VAR_pdfshift_api_key:-${PDFSHIFT_API_KEY:-${TL_VAR_pdfshift_api_key:-}}}"
      export TF_VAR_extractor_webhook_secret="${TF_VAR_extractor_webhook_secret:-${EXTRACTOR_WEBHOOK_SECRET:-${TL_VAR_extractor_webhook_secret:-}}}"
      export TF_VAR_langfuse_secret_key="${TF_VAR_langfuse_secret_key:-${LANGFUSE_SECRET_KEY:-${TL_VAR_langfuse_secret_key:-}}}"
      export TF_VAR_langfuse_public_key="${TF_VAR_langfuse_public_key:-${LANGFUSE_PUBLIC_KEY:-${TL_VAR_langfuse_public_key:-}}}"
      export TF_VAR_email_user="${TF_VAR_email_user:-${EMAIL_USER:-${TL_VAR_email_user:-}}}"
      export TF_VAR_email_pass="${TF_VAR_email_pass:-${EMAIL_PASS:-${TL_VAR_email_pass:-}}}"

frontend:validate:
  stage: validate
  image: node:20-bookworm
  script:
    - cd frontend
    - npm ci
    - npx eslint "src/**/*.{ts,tsx,js,jsx}" --ignore-pattern "public/**" --ignore-pattern "builds/**" --ignore-pattern "vendor/**" -f json -o lint_output.json || true
    - npx eslint "src/**/*.{ts,tsx,js,jsx}" --ignore-pattern "public/**" --ignore-pattern "builds/**" --ignore-pattern "vendor/**" -f unix > lint_output.txt || true
  artifacts:
    when: always
    paths:
      - frontend/lint_output.json
      - frontend/lint_output.txt

backend:validate:
  stage: validate
  image: python:3.12-slim
  script:
    - cd backend
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - python -m compileall app

backend:unit:
  stage: unit
  image: python:3.12-slim
  script:
    - cd backend
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt pytest
    - pytest -q

frontend:build:
  stage: build
  image: node:20-bookworm
  script:
    - cd frontend
    - |
      write_env() {
        key="$1"
        value="$2"
        if [ -z "$value" ]; then
          value="$3"
        fi
        printf '%s=%s\n' "$key" "$value" >> .env.local
      }
      : > .env.local
      write_env NEXT_PUBLIC_SUPABASE_URL "${NEXT_PUBLIC_SUPABASE_URL:-${TF_VAR_next_public_supabase_url:-${TL_VAR_next_public_supabase_url:-}}}" "https://example.invalid"
      write_env NEXT_PUBLIC_SUPABASE_ANON_KEY "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-${TF_VAR_next_public_supabase_anon_key:-${TL_VAR_next_public_supabase_anon_key:-}}}" "placeholder-anon-key"
      write_env NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET "${NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET:-${TF_VAR_next_public_supabase_storage_bucket:-${TL_VAR_next_public_supabase_storage_bucket:-}}}" "proposals"
      write_env NEXT_PUBLIC_BACKEND_URL "${NEXT_PUBLIC_BACKEND_URL:-${TF_VAR_vercel_backend_url:-${TL_VAR_vercel_backend_url:-}}}" "http://127.0.0.1:8000"
      write_env NEXT_PUBLIC_APP_URL "${NEXT_PUBLIC_APP_URL:-${TF_VAR_vercel_frontend_url:-${TL_VAR_vercel_frontend_url:-}}}" "http://localhost:3000"
      write_env PDFSHIFT_API_KEY "${PDFSHIFT_API_KEY:-${TF_VAR_pdfshift_api_key:-${TL_VAR_pdfshift_api_key:-}}}" ""
    - npm ci
    - npm run build

ci:precheck:
  stage: validate
  image: node:20-bookworm
  script:
    - |
      # Only run precheck on main to avoid blocking MR pipelines that lack protected secrets
      if [ "$CI_COMMIT_BRANCH" != "main" ]; then
        echo "ci:precheck skipped (not main)."
        exit 0
      fi
      missing=0
      check_any() {
        names="$@"
        found=0
        for n in $names; do
          if [ -n "${!n:-}" ]; then
            echo "Found required env: $n"
            found=1
            break
          fi
        done
        if [ "$found" -ne 1 ]; then
          echo "Missing any of: $names"
          missing=1
        fi
      }
      check_any NEXT_PUBLIC_SUPABASE_URL TF_VAR_next_public_supabase_url TL_VAR_next_public_supabase_url
      check_any NEXT_PUBLIC_SUPABASE_ANON_KEY TF_VAR_next_public_supabase_anon_key TL_VAR_next_public_supabase_anon_key
      check_any LANGFUSE_SECRET_KEY TF_VAR_langfuse_secret_key TL_VAR_langfuse_secret_key
      check_any LANGFUSE_PUBLIC_KEY TF_VAR_langfuse_public_key TL_VAR_langfuse_public_key
      if [ "$missing" -ne 0 ]; then
        echo "One or more required env vars are missing for main pipeline. Set protected CI variables (NEXT_PUBLIC_*, TF_VAR_*, or TL_VAR_*)."
        exit 1
      fi
backend:integration:
  stage: integration
  image: python:3.12-slim
  script:
    - cd backend
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - uvicorn app.main:app --host 127.0.0.1 --port 8000 &
    - python tests/wait_for_http.py http://127.0.0.1:8000/healthz
    - python tests/integration_smoke.py http://127.0.0.1:8000

frontend:routing:
  stage: integration
  image: node:20-bookworm
  script:
    - cd frontend
    - npm ci
    - npm run build
    - npm run start -- --hostname 127.0.0.1 --port 3000 &
    - node tests/wait-for-http.mjs http://127.0.0.1:3000/companies
    - node tests/routing-smoke.mjs http://127.0.0.1:3000
    - node tests/route-and-api-smoke.mjs http://127.0.0.1:3000

frontend:render:
  stage: render
  image: node:20-bookworm
  script:
    - cd frontend
    - npm ci
    - npm run build
    - npm run start -- --hostname 127.0.0.1 --port 3000 &
    - node tests/wait-for-http.mjs http://127.0.0.1:3000/companies
    - node tests/route-and-api-smoke.mjs http://127.0.0.1:3000
    - node tests/pdf-render-smoke.mjs http://127.0.0.1:3000

mirror:github:
  stage: mirror
  image:
    name: alpine/git:2.49.0
    entrypoint: ["/bin/sh", "-lc"]
  script:
    - |
      if [ -z "${GITHUB_MIRROR_TOKEN:-}" ] || [ -z "${GITHUB_MIRROR_REPOSITORY:-}" ]; then
        echo "Missing GITHUB_MIRROR_TOKEN or GITHUB_MIRROR_REPOSITORY. Configure GitHub mirroring in GitLab CI/CD variables."
        exit 1
      fi
    - git remote add github "https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/${GITHUB_MIRROR_REPOSITORY}.git"
    - git push github HEAD:main
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

terraform:fmt:
  stage: validate
  extends: .terraform_base
  script:
    - cd terraform
    - terraform fmt -check -diff || (echo "terraform fmt failed" && exit 1)
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

terraform:validate:
  stage: validate
  extends: .terraform_base
  script:
    - cd terraform
    - terraform init -backend=false
    - terraform validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

terraform:plan:
  stage: iac
  extends: .terraform_base
  script:
    - cd terraform
    - terraform init -input=false
    - terraform plan -no-color -out=tfplan
    - terraform show -no-color tfplan
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

terraform:apply:
  stage: iac
  extends: .terraform_base
  script:
    - cd terraform
    - terraform init -input=false
    - terraform apply -auto-approve tfplan
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
