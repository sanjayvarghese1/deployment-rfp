workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - validate
  - iac
  - unit
  - build
  - integration
  - render
  - mirror

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  NEXT_TELEMETRY_DISABLED: "1"
  TF_STATE_NAME: "deployment-rfp"

cache:
  paths:
    - .cache/pip
    - .cache/npm

default:
  interruptible: true

.terraform_base:
  image: debian:bookworm-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl unzip
    - rm -rf /var/lib/apt/lists/*
    - export TERRAFORM_VERSION="1.11.3"
    - curl -fsSL -o /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
    - unzip -o /tmp/terraform.zip -d /usr/local/bin
    - terraform version
    - export TF_HTTP_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
    - export TF_HTTP_LOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
    - export TF_HTTP_UNLOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
    - export TF_HTTP_LOCK_METHOD="POST"
    - export TF_HTTP_UNLOCK_METHOD="DELETE"
    - export TF_HTTP_RETRY_WAIT_MIN="5"
    - export TF_HTTP_USERNAME="gitlab-ci-token"
    - export TF_HTTP_PASSWORD="${CI_JOB_TOKEN}"
    - |
      # Map the GitLab variables you configured into Terraform's required TF_VAR_* names.
      export TF_VAR_vercel_api_token="${vercel_api_token:-}"
      export TF_VAR_vercel_git_repository="${vercel_git_repository:-}"
      export TF_VAR_vercel_backend_url="${DEPLOYED_BACKEND_URL:-}"
      export TF_VAR_vercel_frontend_url="${DEPLOYED_FRONTEND_URL:-}"
      export TF_VAR_next_public_supabase_url="${NEXT_PUBLIC_SUPABASE_URL:-}"
      export TF_VAR_next_public_supabase_anon_key="${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}"
      export TF_VAR_next_public_supabase_storage_bucket="${NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET:-}"
      export TF_VAR_supabase_service_role_key="${supabase_service_role_key:-}"
      export TF_VAR_openrouter_api_key="${openrouter_api_key:-}"
      export TF_VAR_openrouter_base_url="${openrouter_base_url:-}"
      export TF_VAR_openrouter_primary_model="${openrouter_primary_model:-}"
      export TF_VAR_openrouter_fallback_model="${openrouter_fallback_model:-}"
      export TF_VAR_openrouter_analysis_model="${openrouter_analysis_model:-}"
      export TF_VAR_vercel_team_id="${vercel_team_id:-}"
      export TF_VAR_vercel_custom_domain="${vercel_custom_domain:-}"
      export TF_VAR_pdfshift_api_key="${pdfshift_api_key:-}"
      export TF_VAR_pdfshift_sandbox="${pdfshift_sandbox:-}"
      export TF_VAR_extractor_webhook_secret="${extractor_webhook_secret:-}"
      export TF_VAR_langfuse_secret_key="${langfuse_secret_key:-}"
      export TF_VAR_langfuse_public_key="${langfuse_public_key:-}"
      export TF_VAR_langfuse_base_url="${langfuse_base_url:-}"
      export TF_VAR_email_user="${email_user:-}"
      export TF_VAR_email_pass="${email_pass:-}"
      export TF_VAR_llm_guard_enable="${llm_guard_enable:-}"
      export TF_VAR_analysis_full_score_confidence="${analysis_full_score_confidence:-}"
      export TF_VAR_analysis_scoring_strictness="${analysis_scoring_strictness:-}"

frontend:validate:
  stage: validate
  image: node:20-bookworm
  script:
    - cd frontend
    - npm ci
    - npx eslint "src/**/*.{ts,tsx,js,jsx}" --ignore-pattern "public/**" --ignore-pattern "builds/**" --ignore-pattern "vendor/**" -f json -o lint_output.json || true
    - npx eslint "src/**/*.{ts,tsx,js,jsx}" --ignore-pattern "public/**" --ignore-pattern "builds/**" --ignore-pattern "vendor/**" -f unix > lint_output.txt || true
  artifacts:
    when: always
    paths:
      - frontend/lint_output.json
      - frontend/lint_output.txt

backend:validate:
  stage: validate
  image: python:3.12-slim
  script:
    - cd backend
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - python -m compileall app

backend:unit:
  stage: unit
  image: python:3.12-slim
  script:
    - cd backend
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt pytest
    - pytest -q

frontend:build:
  stage: build
  image: node:20-bookworm
  script:
    - cd frontend
    - |
      write_env() {
        key="$1"
        value="$2"
        if [ -z "$value" ]; then
          value="$3"
        fi
        printf '%s=%s\n' "$key" "$value" >> .env.local
      }
      : > .env.local
      write_env NEXT_PUBLIC_SUPABASE_URL "${NEXT_PUBLIC_SUPABASE_URL:-}" "https://example.invalid"
      write_env NEXT_PUBLIC_SUPABASE_ANON_KEY "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" "placeholder-anon-key"
      write_env NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET "${NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET:-}" "proposals"
      write_env NEXT_PUBLIC_BACKEND_URL "${DEPLOYED_BACKEND_URL:-}" "http://127.0.0.1:8000"
      write_env NEXT_PUBLIC_APP_URL "${DEPLOYED_FRONTEND_URL:-}" "http://localhost:3000"
      write_env OPENROUTER_API_KEY "${openrouter_api_key:-}" ""
      write_env OPENROUTER_BASE_URL "${openrouter_base_url:-}" "https://openrouter.ai/api/v1"
      write_env OPENROUTER_PRIMARY_MODEL "${openrouter_primary_model:-}" "minimax/minimax-m2.7"
      write_env OPENROUTER_INTAKE_MODEL "${openrouter_intake_model:-}" "minimax/minimax-m2.7"
      write_env OPENROUTER_FALLBACK_MODEL "${openrouter_fallback_model:-}" "minimax/minimax-m2.5"
      write_env OPENROUTER_ANALYSIS_MODEL "${openrouter_analysis_model:-}" "minimax/minimax-m2.7"
      write_env LANGFUSE_SECRET_KEY "${langfuse_secret_key:-}" ""
      write_env LANGFUSE_PUBLIC_KEY "${langfuse_public_key:-}" ""
      write_env LANGFUSE_BASE_URL "${langfuse_base_url:-}" "https://cloud.langfuse.com"
      write_env PDFSHIFT_API_KEY "${pdfshift_api_key:-}" ""
    - npm ci
    - npm run build

ci:precheck:
  stage: validate
  image: node:20-bookworm
  script:
    - |
      # Only run precheck on main to avoid blocking MR pipelines that lack protected secrets
      if [ "$CI_COMMIT_BRANCH" != "main" ]; then
        echo "ci:precheck skipped (not main)."
        exit 0
      fi
      missing=0
      check_any() {
        found=0
        for n in "$@"; do
          if printenv "$n" >/dev/null 2>&1; then
            echo "Found required env: $n"
            found=1
            break
          fi
        done
        if [ "$found" -ne 1 ]; then
          echo "Missing any of: $*"
          missing=1
        fi
      }
      check_any NEXT_PUBLIC_SUPABASE_URL
      check_any NEXT_PUBLIC_SUPABASE_ANON_KEY
      check_any NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET
      check_any DEPLOYED_BACKEND_URL
      check_any DEPLOYED_FRONTEND_URL
      check_any vercel_git_repository
      check_any langfuse_secret_key
      check_any langfuse_public_key
      check_any langfuse_base_url
      check_any openrouter_api_key
      check_any openrouter_base_url
      check_any openrouter_primary_model
      check_any openrouter_intake_model
      check_any openrouter_fallback_model
      check_any openrouter_analysis_model
      check_any pdfshift_api_key
      check_any pdfshift_sandbox
      check_any supabase_service_role_key
      check_any vercel_api_token
      if [ "$missing" -ne 0 ]; then
        echo "One or more required env vars are missing for main pipeline. Set the protected GitLab variables listed in the docs."
        exit 1
      fi
backend:integration:
  stage: integration
  image: python:3.12-slim
  script:
    - cd backend
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - uvicorn app.main:app --host 127.0.0.1 --port 8000 &
    - python tests/wait_for_http.py http://127.0.0.1:8000/healthz
    - python tests/integration_smoke.py http://127.0.0.1:8000

